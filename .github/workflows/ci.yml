name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  earshotd:
    name: earshotd (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    defaults:
      run:
        working-directory: earshotd
    # uv's own Python, as deploy/macos/install.sh pins it: the runner's Framework Python re-execs
    # Python.app, which the Mac service's exec allowlist denies, and it is not what ships.
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run mypy .
      - run: uv run ruff check .
      - name: Read the whisper revision
        id: whisper
        run: |
          revision=$(uv run python -m earshotd.models revision whisper)
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/huggingface/hub/models--mobiuslabsgmbh--faster-whisper-large-v3-turbo
          key: whisper-${{ runner.os }}-${{ steps.whisper.outputs.revision }}
      - name: Fetch whisper
        run: uv run python -c 'from faster_whisper.utils import download_model; download_model("large-v3-turbo")'
      - name: Test
        run: uv run pytest -q -rs

  app:
    name: app
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift format lint --strict --recursive .
      - run: swift build
      - run: swift test

  duplication:
    name: duplication
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # jscpd 5.3.3 depends on its exact-version platform package alone, which has no
      # dependencies and no install scripts, so the closure is exact without a lockfile.
      - name: Install jscpd
        run: | # zizmor: ignore[adhoc-packages]
          mkdir "$RUNNER_TEMP/jscpd"
          cd "$RUNNER_TEMP/jscpd"
          npm install --no-save --ignore-scripts jscpd@5.3.3
      - name: Scan for duplicated code
        run: |
          report="$RUNNER_TEMP/jscpd-report"
          "$RUNNER_TEMP/jscpd/node_modules/.bin/jscpd" . \
            --format python,swift \
            --ignore "**/test_*.py,**/*_test.py,**/tests/**,**/Tests/**" \
            --reporters json --output "$report"
          echo "files scanned: $(jq '.statistics.total.sources' "$report/jscpd-report.json")"
          jq -r '.duplicates[] | "\(.firstFile.name):\(.firstFile.start)-\(.firstFile.end) <-> \(.secondFile.name):\(.secondFile.start)-\(.secondFile.end) (\(.lines) lines)"' "$report/jscpd-report.json"
          test "$(jq '.duplicates | length' "$report/jscpd-report.json")" -eq 0
