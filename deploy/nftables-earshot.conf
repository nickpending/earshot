#!/usr/sbin/nft -f
# The daemon's port is reachable only from loopback and the hosts named in proxy_addresses in
# /etc/earshot/earshotd.toml. Other traffic is untouched (policy accept); only that port is filtered.
# This is the second layer. The first is mutual TLS on the hop: earshotd completes no handshake
# with a client that lacks the proxy's certificate, so a spoofed source address reaches no HTTP.
# With insecure_plain_http = true this rule is the only protection.
# deploy/install.sh renders this file only when `listen` is a network address: the dport matches
# come from `listen`, and the marker line in the input chain becomes one accept line per
# proxy_addresses entry. The port written here is only the default.

table inet earshot
delete table inet earshot

table inet earshot {
	chain input {
		type filter hook input priority filter; policy accept;
		iif "lo" accept
		PROXY_ACCEPT_LINES
		tcp dport 8080 drop
	}
}
